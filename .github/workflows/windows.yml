name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      prepare:
        description: Prepare and verify a candidate at this exact branch commit (publication requires main)
        type: boolean
        default: false
      publish:
        description: Publish the verified main commit, reusing its successful build
        type: boolean
        default: false
      extended:
        description: Run large-data benchmarks and all compatibility checks explicitly
        type: boolean
        default: false
      exercise_rerun:
        description: Exercise package-job recovery with one intentional failure (non-main branches only)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  resolve:
    runs-on: windows-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
      - name: Resolve source and release verification independently
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_PUBLISH: ${{ inputs.publish || false }}
          REQUEST_PREPARE: ${{ inputs.prepare || false }}
          EXERCISE_RERUN: ${{ inputs.exercise_rerun || false }}
        run: python tools/release_pipeline.py plan --publish "$env:REQUEST_PUBLISH" --prepare "$env:REQUEST_PREPARE" --exercise-rerun "$env:EXERCISE_RERUN"
      - name: Plan source and deployment checks from their own baselines
        id: plan
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PACKAGE_BASE: ${{ steps.release.outputs.base }}
          SOURCE_BASE: ${{ steps.release.outputs.source_base }}
          RELEASE_CANDIDATE: ${{ steps.release.outputs.candidate }}
          EXTENDED: ${{ inputs.extended || false }}
        run: |
          $packageBase = if ($env:EVENT_NAME -eq 'pull_request') { $env:PR_BASE } else { $env:PACKAGE_BASE }
          $sourceBase = if ($env:SOURCE_BASE) { $env:SOURCE_BASE } elseif ($env:EVENT_NAME -eq 'pull_request') { $env:PR_BASE } else { '' }
          python tools/ci_plan.py "--base=$packageBase" "--source-base=$sourceBase" --candidate "$env:RELEASE_CANDIDATE" --extended "$env:EXTENDED" --release-plan artifacts/verification/release-plan.json
          exit $LASTEXITCODE
  native:
    needs: resolve
    if: fromJSON(needs.resolve.outputs.plan).verify && fromJSON(needs.resolve.outputs.plan).rust
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CHECK_PLAN: ${{ needs.resolve.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
      - name: Check the planned environment before compilation
        run: python tools/release_pipeline.py source-environment
      - name: Identify the exact native build
        id: native-key
        shell: pwsh
        run: |
          $key = python tools/build_native.py --cache-key
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "key=$key" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v5
        id: native-cache
        with:
          path: |
            cachemonitor/_cpu_native.pyd
            cachemonitor/_cpu_native.build.json
            cachemonitor/_cpu_native.notices.zip
          key: ${{ steps.native-key.outputs.key }}-notices-${{ hashFiles('tools/collect_notices.py') }}
          restore-keys: ${{ steps.native-key.outputs.key }}
      - name: Reuse or build and test the locked Rust extension
        run: python tools/build_native.py --reuse --test
      - name: Prepare the matching Rust dependency notices
        run: python tools/collect_notices.py --prepare-rust-artifact cachemonitor/_cpu_native.notices.zip
      - uses: actions/cache/save@v5
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            cachemonitor/_cpu_native.pyd
            cachemonitor/_cpu_native.build.json
            cachemonitor/_cpu_native.notices.zip
          key: ${{ steps.native-key.outputs.key }}-notices-${{ hashFiles('tools/collect_notices.py') }}
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ github.sha }}-${{ github.run_id }}
          path: |
            cachemonitor/_cpu_native.pyd
            cachemonitor/_cpu_native.build.json
            cachemonitor/_cpu_native.notices.zip
          retention-days: 30
          overwrite: true
          if-no-files-found: error
  source:
    needs: [resolve, native]
    if: always() && needs.resolve.result == 'success' && fromJSON(needs.resolve.outputs.plan).verify && (needs.native.result == 'success' || needs.native.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CODEXON_CPU_BACKEND: ${{ fromJSON(needs.resolve.outputs.plan).rust && 'rust' || 'auto' }}
      CHECK_PLAN: ${{ needs.resolve.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: requirements-release.lock
      - name: Check the planned environment before source setup
        run: python tools/release_pipeline.py source-environment
      - uses: actions/download-artifact@v8
        if: fromJSON(needs.resolve.outputs.plan).rust
        with:
          name: native-${{ github.sha }}-${{ github.run_id }}
          path: cachemonitor/
      - name: Validate the shared tested Rust extension
        if: fromJSON(needs.resolve.outputs.plan).rust
        run: python tools/build_native.py --check --test
      - name: Install locked dependencies
        if: join(fromJSON(needs.resolve.outputs.plan).tests, '') != ''
        run: python -m pip install -r requirements-release.lock
      - name: Check source and test environment before running checks
        if: join(fromJSON(needs.resolve.outputs.plan).tests, '') != ''
        run: python tools/check_environment.py
      - name: Restore the immutable check plan
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/verification | Out-Null
          $env:CHECK_PLAN | Set-Content -Encoding utf8 artifacts/verification/plan.json
      - name: Run selected source checks
        timeout-minutes: 15
        shell: pwsh
        # Keep synthetic databases and process fixtures on the job's scratch
        # volume. Preserve real filesystem commits and crash-recovery checks.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          Write-Host "Source scratch: $env:TEMP"
          $plan = $env:CHECK_PLAN | ConvertFrom-Json
          [string[]]$checkArgs = $plan.source_args
          python tools/verify_changes.py @checkArgs
          exit $LASTEXITCODE
      - name: Check overlay native scaling
        if: fromJSON(needs.resolve.outputs.plan).scales
        timeout-minutes: 5
        shell: pwsh
        run: |
          $failed = $false
          foreach ($scale in @('1.25', '2')) {
            $env:CODEXON_OVERLAY_QA_OUTPUT = "artifacts/verification/overlay-scale-$scale"
            python tools/run_ui_checks.py --timeout 120 --scale $scale -- python -m pytest -p tools.check_progress -q tests/test_overlay_resilience.py::test_auto_fallback_restores_preference_anchor_and_clickthrough tests/test_overlay_controls.py::test_popup_controls_fit_native_viewport_and_remain_clickable --junitxml="artifacts/verification/overlay-scale-$scale.xml"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Record successful source coverage before deployment checks
        run: python tools/release_pipeline.py source-receipt --folder artifacts/source-receipt
      - uses: actions/upload-artifact@v7
        with:
          name: source-verified-${{ github.sha }}
          path: artifacts/source-receipt/source-verification.json
          retention-days: 30
          overwrite: true
          if-no-files-found: error
      - name: Upload synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-${{ github.run_attempt }}
          path: |
            artifacts/verification/**/*.json
            artifacts/verification/**/*.xml
            artifacts/verification/**/*.png
            artifacts/verification/**/*.log
          retention-days: 7
          if-no-files-found: ignore
  package_build:
    needs: [resolve, native]
    if: always() && needs.resolve.result == 'success' && needs.native.result == 'success' && fromJSON(needs.resolve.outputs.plan).verify && fromJSON(needs.resolve.outputs.plan).package
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CHECK_PLAN: ${{ needs.resolve.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: requirements-release.lock
      - name: Check the planned environment before build setup
        run: python tools/release_pipeline.py source-environment
      - uses: actions/download-artifact@v8
        with:
          name: native-${{ github.sha }}-${{ github.run_id }}
          path: cachemonitor/
      - name: Validate the shared tested Rust extension
        run: python tools/build_native.py --check --test
      - name: Install locked dependencies
        run: python -m pip install -r requirements-release.lock
      - name: Check source and test environment before running checks
        run: python tools/check_environment.py
      - name: Restore the immutable check plan
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/verification | Out-Null
          $env:CHECK_PLAN | Set-Content -Encoding utf8 artifacts/verification/plan.json
      - name: Check changed dependencies for vulnerabilities
        if: fromJSON(needs.resolve.outputs.plan).dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements-release.lock
      - name: Build Windows package
        shell: pwsh
        run: .\build.ps1 -DistPath dist-ci -WorkPath build-ci -PythonPath ((Get-Command python).Source) -UseNativeArtifact
      - name: Build isolated installer
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler is required on this Windows runner' }
          .\tools\Build-Installer.ps1 -ProductDir dist-ci/Codexon -OutputDir dist-ci/qa-isolated -Compiler $compiler.FullName -Isolated
          python tools/prepare_bad_runtime.py --product dist-ci/Codexon --output dist-ci/bad-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tools\Build-Installer.ps1 -ProductDir dist-ci/bad-runtime -OutputDir dist-ci/qa-bad-runtime -Compiler $compiler.FullName -Isolated
      - name: Build release installer before validation
        if: fromJSON(needs.resolve.outputs.plan).release_artifact
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler is required on this Windows runner' }
          .\tools\Build-Installer.ps1 -ProductDir dist-ci/Codexon -OutputDir dist-ci/release -Compiler $compiler.FullName
      - name: Record exact candidate contents
        run: python tools/release_pipeline.py candidate --folder dist-ci
      - name: Retain candidate for independent installation reruns
        uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ github.sha }}-${{ github.run_id }}
          path: dist-ci/
          retention-days: 30
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - name: Upload synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-build-${{ github.run_attempt }}
          path: |
            artifacts/verification/**/*.json
            artifacts/verification/**/*.xml
            artifacts/verification/**/*.png
            artifacts/verification/**/*.log
          retention-days: 7
          if-no-files-found: ignore
  package_verify:
    needs: [resolve, source, package_build]
    if: always() && needs.source.result == 'success' && ((fromJSON(needs.resolve.outputs.plan).package && needs.package_build.result == 'success') || (!fromJSON(needs.resolve.outputs.plan).package && fromJSON(needs.resolve.outputs.plan).qa_reuse))
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CHECK_PLAN: ${{ needs.resolve.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: requirements-release.lock
      - name: Check the planned environment before package setup
        run: python tools/release_pipeline.py source-environment
      - name: Install locked dependencies
        run: python -m pip install -r requirements-release.lock
      - name: Check source and test environment before running checks
        run: python tools/check_environment.py
      - name: Restore the immutable check plan
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/verification | Out-Null
          $env:CHECK_PLAN | Set-Content -Encoding utf8 artifacts/verification/plan.json
      - name: Download this run's exact candidate
        if: fromJSON(needs.resolve.outputs.plan).package
        uses: actions/download-artifact@v8
        with:
          name: candidate-${{ github.sha }}-${{ github.run_id }}
          path: dist-ci
      - name: Reject a foreign or modified candidate before execution
        if: fromJSON(needs.resolve.outputs.plan).package
        run: python tools/release_pipeline.py check-candidate --folder dist-ci
      - name: Exercise package-job recovery when explicitly requested
        if: inputs.exercise_rerun && github.run_attempt == 1
        run: python tools/run_ui_checks.py --no-desktop --kind installation -- python -c "raise RuntimeError('Requested first-attempt package validation failure')"
      - name: Check independent offline recovery
        if: fromJSON(needs.resolve.outputs.plan).package
        run: |
          python tools/run_ui_checks.py -- python tools/verify_recovery.py --executable dist-ci/Codexon/CodexonRecovery.exe --output artifacts/verification/recovery-en --language en
      - name: Check changed QA tools with the matching published binary
        if: fromJSON(needs.resolve.outputs.plan).qa_reuse
        run: python tools/run_ui_checks.py -- python tools/verify_release_tools.py --plan artifacts/verification/plan.json
      - name: Check installation, update and removal
        if: fromJSON(needs.resolve.outputs.plan).native
        run: python tools/run_ui_checks.py --no-desktop --timeout 660 --kind installation -- python tools/run_native_checks.py --output artifacts/verification/native-installation -- python tools/run_ui_checks.py --kind installation -- python tools/verify_installation.py --installer dist-ci/qa-isolated/Codexon-Setup.exe --broken-installer dist-ci/qa-bad-runtime/Codexon-Setup.exe --output artifacts/verification/installation
      - name: Check installation from an MSIX process
        if: fromJSON(needs.resolve.outputs.plan).msix
        timeout-minutes: 15
        run: python tools/run_ui_checks.py --no-desktop --timeout 780 --kind installation -- powershell.exe -NoProfile -NonInteractive -File .\tools\verify_msix_installation.ps1 -Installer dist-ci/qa-isolated/Codexon-Setup.exe -BrokenInstaller dist-ci/qa-bad-runtime/Codexon-Setup.exe -Output artifacts/verification/msix-installation -Python ((Get-Command python).Source)
      - name: Check frozen runtime and Qt Quick interaction
        if: fromJSON(needs.resolve.outputs.plan).package
        run: python tools/run_ui_checks.py -- python tools/verify_changes.py --package-only --package-exe dist-ci/Codexon/Codexon.exe
      - name: Check migration from the actual published installer
        if: fromJSON(needs.resolve.outputs.plan).proxy
        shell: pwsh
        run: |
          python tools/prepare_legacy_release.py --tag v2026.09.25.6 --output artifacts/legacy-published
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $published = Get-Content artifacts/legacy-published/result.json -Raw | ConvertFrom-Json
          python tools/run_ui_checks.py -- python tools/verify_retired_worker.py --old-exe $published.executable --new-exe dist-ci/Codexon/Codexon.exe --output artifacts/verification/published-worker-retirement
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_ui_checks.py --no-desktop --kind installation -- python tools/verify_proxy_update.py --old-exe $published.executable --new-exe dist-ci/Codexon/Codexon.exe --idle-connections 100 --output artifacts/verification/published-proxy-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_ui_checks.py -- python tools/verify_app_services.py --executable dist-ci/Codexon/Codexon.exe --legacy-collector-exe $published.executable --output artifacts/verification/published-app-services
      - name: Check packaged GUI handoff with multiple custom homes
        if: fromJSON(needs.resolve.outputs.plan).gui_handoff
        run: python tools/run_ui_checks.py -- python tools/verify_gui_handoff.py --executable dist-ci/Codexon/Codexon.exe --output artifacts/verification/gui-handoff
      - name: Check proxy replacement with a custom observation filename
        if: fromJSON(needs.resolve.outputs.plan).proxy
        shell: pwsh
        run: |
          python tools/prepare_legacy_release.py --tag v2026.10.01.1 --output artifacts/legacy-custom-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $published = Get-Content artifacts/legacy-custom-path/result.json -Raw | ConvertFrom-Json
          python tools/run_ui_checks.py --no-desktop --kind installation -- python tools/verify_proxy_update.py --old-exe $published.executable --new-exe dist-ci/Codexon/Codexon.exe --idle-connections 100 --custom-evidence --output artifacts/verification/custom-observation-update
          exit $LASTEXITCODE
      - name: Check installer payload contents
        if: fromJSON(needs.resolve.outputs.plan).package
        run: python tools/package_release.py --product dist-ci/Codexon --validate-only
      - name: Seal the fully verified release candidate
        if: fromJSON(needs.resolve.outputs.plan).release_artifact
        shell: pwsh
        run: |
          python tools/release_pipeline.py seal --folder dist-ci/release --product dist-ci/Codexon
          exit $LASTEXITCODE
      - name: Retain the verified installer for later publication
        if: fromJSON(needs.resolve.outputs.plan).release_artifact
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-${{ github.sha }}
          path: dist-ci/release/
          retention-days: 30
          overwrite: true
          if-no-files-found: error
          compression-level: 0
      - name: Upload synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-verification-${{ github.run_attempt }}
          path: |
            artifacts/verification/**/*.json
            artifacts/verification/**/*.xml
            artifacts/verification/**/*.png
            artifacts/verification/**/*.log
          retention-days: 7
          if-no-files-found: ignore
  verify:
    needs: [resolve, native, source, package_build, package_verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
      - name: Require every planned check to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
          CHECK_PLAN: ${{ needs.resolve.outputs.plan }}
        run: python tools/release_pipeline.py verdict
  publish:
    needs: [resolve, verify]
    if: always() && inputs.publish && needs.resolve.result == 'success' && needs.verify.result == 'success' && !fromJSON(needs.resolve.outputs.plan).published
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
      - name: Publish the existing verified installer
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ fromJSON(needs.resolve.outputs.plan).reuse_run || github.run_id }}
        run: python tools/release_pipeline.py publish --verified-run "$VERIFIED_RUN"
