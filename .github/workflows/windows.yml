name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: requirements-release.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements-release.lock
      - name: Check package vulnerabilities
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements-release.lock
      - name: Plan checks
        run: python tools/verify_changes.py --plan
      - name: Million-observation chart performance
        timeout-minutes: 3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/verification -Force | Out-Null
          python tools/run_ui_checks.py -- python -m pytest -v --tb=short tests/test_quota_chart_performance.py --basetemp artifacts/verification/chart
      - name: Full regression
        timeout-minutes: 15
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/verification/full -Force | Out-Null
          python tools/run_ui_checks.py -- python -m pytest -v --tb=short --durations=10 -o faulthandler_timeout=120 tests --ignore=tests/test_quota_chart_performance.py 2>&1 | Tee-Object artifacts/verification/full/pytest.log
          exit $LASTEXITCODE
      - name: Small-screen rendering
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python -m pytest -q tests/test_ui.py tests/test_model_ui.py tests/test_call_transport.py tests/test_quota_detail_card.py
      - name: Build Windows package
        shell: pwsh
        run: .\build.ps1 -DistPath dist-ci -WorkPath build-ci -PythonPath ((Get-Command python).Source)
      - name: Check frozen runtime and Qt Quick interaction
        run: python tools/run_ui_checks.py -- python tools/verify_changes.py --base HEAD --package-exe dist-ci/Codexon/Codexon.exe
      - name: Build previous package and check managed proxy replacement
        shell: pwsh
        run: |
          git worktree add --detach ../codexon-previous a60680d
          & ../codexon-previous/build.ps1 -DistPath ../codexon-previous-dist -WorkPath ../codexon-previous-build -PythonPath ((Get-Command python).Source)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_proxy_update.py --old-exe ../codexon-previous-dist/Codexon/Codexon.exe --new-exe dist-ci/Codexon/Codexon.exe --output artifacts/verification/proxy-update
      - name: Check packaged GUI handoff with multiple custom homes
        run: python tools/run_ui_checks.py -- python tools/verify_gui_handoff.py --executable dist-ci/Codexon/Codexon.exe --output artifacts/verification/gui-handoff
      - name: Check installer payload contents
        run: python tools/package_release.py --product dist-ci/Codexon --validate-only
      - name: Check independent offline recovery
        run: |
          python tools/run_ui_checks.py -- python tools/verify_recovery.py --executable dist-ci/Codexon/CodexonRecovery.exe --output artifacts/verification/recovery-ko
          python tools/run_ui_checks.py -- python tools/verify_recovery.py --executable dist-ci/Codexon/CodexonRecovery.exe --output artifacts/verification/recovery-en --language en
      - name: Build isolated installer
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler is required on this Windows runner' }
          .\tools\Build-Installer.ps1 -ProductDir dist-ci/Codexon -OutputDir dist-ci/qa-setup -Compiler $compiler.FullName -Isolated
          python tools/prepare_bad_runtime.py --product dist-ci/Codexon --output dist-ci/bad-runtime
          .\tools\Build-Installer.ps1 -ProductDir dist-ci/bad-runtime -OutputDir dist-ci/qa-bad-runtime -Compiler $compiler.FullName -Isolated
      - name: Check installation, update and removal
        run: python tools/run_ui_checks.py -- python tools/verify_installation.py --installer dist-ci/qa-setup/Codexon-Setup.exe --broken-installer dist-ci/qa-bad-runtime/Codexon-Setup.exe --output artifacts/verification/installation
      - name: Upload redacted synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-verification
          path: artifacts/verification/
          if-no-files-found: ignore
