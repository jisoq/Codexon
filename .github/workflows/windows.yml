name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified main commit, reusing its successful build
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
# A release request waits for the push check of this exact commit.
concurrency:
  group: windows-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.release.outputs.verify }}
      candidate: ${{ steps.release.outputs.candidate }}
      reuse_run: ${{ steps.release.outputs.reuse_run }}
      published: ${{ steps.release.outputs.published }}
      base: ${{ steps.release.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
      - name: Resolve the exact commit's verified release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_PUBLISH: ${{ inputs.publish || false }}
        run: python tools/release_pipeline.py plan --publish "$REQUEST_PUBLISH"
  verify:
    needs: resolve
    if: needs.resolve.outputs.verify == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: requirements-release.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements-release.lock
      - name: Check source and test environment before running checks
        run: python tools/check_environment.py
      - name: Plan checks against the actual change base
        id: plan
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ needs.resolve.outputs.base }}
          RELEASE_CANDIDATE: ${{ needs.resolve.outputs.candidate }}
        run: |
          $base = if ($env:EVENT_NAME -eq 'pull_request') { $env:PR_BASE } else { $env:PUSH_BASE }
          $all = $env:RELEASE_CANDIDATE -eq 'true' -or $env:EVENT_NAME -eq 'workflow_dispatch' -or -not $base -or $base -match '^0+$'
          [string[]]$checkArgs = if ($all) { @('--full') } else { @('--base', $base) }
          $raw = python tools/verify_changes.py --plan @checkArgs
          if ($LASTEXITCODE -ne 0) { throw ($raw -join "`n") }
          $plan = ($raw -join "`n") | ConvertFrom-Json
          New-Item -ItemType Directory -Path artifacts/verification -Force | Out-Null
          $raw | Set-Content -Encoding utf8 artifacts/verification/plan.json
          $package = $all -or $plan.package_impact
          $proxy = $all -or $plan.proxy_impact
          $reuse = $false
          if (-not $package -and $plan.qa_smokes.Count) {
            $reuseResult = python tools/verify_release_tools.py --can-reuse
            if ($LASTEXITCODE -ne 0) { throw 'Cannot check packaged input identity.' }
            $reuse = ($reuseResult | ConvertFrom-Json).reuse
            if (-not $reuse) { $package = $true; $proxy = $true }
          }
          "VERIFY_BASE=$base" | Add-Content $env:GITHUB_ENV
          "VERIFY_FULL=$all" | Add-Content $env:GITHUB_ENV
          "package=$package".ToLowerInvariant() | Add-Content $env:GITHUB_OUTPUT
          "proxy=$proxy".ToLowerInvariant() | Add-Content $env:GITHUB_OUTPUT
          "qa_reuse=$reuse".ToLowerInvariant() | Add-Content $env:GITHUB_OUTPUT
          "dependencies=$($all -or [bool]($plan.changed -match '^requirements'))".ToLowerInvariant() | Add-Content $env:GITHUB_OUTPUT
          $raw
      - name: Check changed dependencies for vulnerabilities
        if: steps.plan.outputs.dependencies == 'true'
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements-release.lock
      - name: Run selected source checks
        timeout-minutes: 15
        shell: pwsh
        run: |
          [string[]]$checkArgs = if ($env:VERIFY_FULL -eq 'True') { @('--full') } else { @('--base', $env:VERIFY_BASE) }
          python tools/run_ui_checks.py -- python tools/verify_changes.py @checkArgs
          exit $LASTEXITCODE
      - name: Check changed QA tools with the matching published binary
        if: steps.plan.outputs.qa_reuse == 'true'
        run: python tools/run_ui_checks.py -- python tools/verify_release_tools.py --plan artifacts/verification/plan.json
      - name: Check overlay native scaling
        shell: pwsh
        run: |
          $plan = Get-Content artifacts/verification/plan.json -Raw | ConvertFrom-Json
          if (-not $plan.full -and -not ($plan.tests -match 'test_overlay_resilience|test_overlay_layout_controller')) { exit 0 }
          $failed = $false
          foreach ($scale in @('1', '1.25', '1.5', '2')) {
            $env:CODEXON_OVERLAY_QA_OUTPUT = "artifacts/verification/overlay-scale-$scale"
            python tools/run_ui_checks.py --scale $scale -- python -m pytest -q tests/test_overlay_resilience.py::test_auto_fallback_restores_preference_anchor_and_clickthrough --junitxml="artifacts/verification/overlay-scale-$scale.xml"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Build Windows package
        if: steps.plan.outputs.package == 'true'
        shell: pwsh
        run: .\build.ps1 -DistPath dist-ci -WorkPath build-ci -PythonPath ((Get-Command python).Source)
      - name: Check independent offline recovery
        if: steps.plan.outputs.package == 'true'
        run: |
          python tools/run_ui_checks.py -- python tools/verify_recovery.py --executable dist-ci/Codexon/CodexonRecovery.exe --output artifacts/verification/recovery-ko
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_ui_checks.py -- python tools/verify_recovery.py --executable dist-ci/Codexon/CodexonRecovery.exe --output artifacts/verification/recovery-en --language en
      - name: Build isolated installer
        if: steps.plan.outputs.package == 'true'
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler is required on this Windows runner' }
          .\tools\Build-Installer.ps1 -ProductDir dist-ci/Codexon -OutputDir dist-ci/qa-isolated -Compiler $compiler.FullName -Isolated
          python tools/prepare_bad_runtime.py --product dist-ci/Codexon --output dist-ci/bad-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tools\Build-Installer.ps1 -ProductDir dist-ci/bad-runtime -OutputDir dist-ci/qa-bad-runtime -Compiler $compiler.FullName -Isolated
      - name: Check installation, update and removal
        if: steps.plan.outputs.package == 'true'
        run: python tools/run_native_checks.py --output artifacts/verification/native-installation -- python tools/run_ui_checks.py -- python tools/verify_installation.py --installer dist-ci/qa-isolated/Codexon-Setup.exe --broken-installer dist-ci/qa-bad-runtime/Codexon-Setup.exe --output artifacts/verification/installation
      - name: Check installation from an MSIX process
        if: steps.plan.outputs.package == 'true'
        shell: powershell
        run: .\tools\verify_msix_installation.ps1 -Installer dist-ci/qa-isolated/Codexon-Setup.exe -BrokenInstaller dist-ci/qa-bad-runtime/Codexon-Setup.exe -Output artifacts/verification/msix-installation -Python ((Get-Command python).Source)
      - name: Check frozen runtime and Qt Quick interaction
        if: steps.plan.outputs.package == 'true'
        run: python tools/run_ui_checks.py -- python tools/verify_changes.py --package-only --package-exe dist-ci/Codexon/Codexon.exe
      - name: Check migration from the actual published installer
        if: steps.plan.outputs.proxy == 'true'
        shell: pwsh
        run: |
          python tools/prepare_legacy_release.py --tag v2026.09.25.6 --output artifacts/legacy-published
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $published = Get-Content artifacts/legacy-published/result.json -Raw | ConvertFrom-Json
          python tools/run_ui_checks.py -- python tools/verify_retired_worker.py --old-exe $published.executable --new-exe dist-ci/Codexon/Codexon.exe --output artifacts/verification/published-worker-retirement
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_proxy_update.py --old-exe $published.executable --new-exe dist-ci/Codexon/Codexon.exe --idle-connections 100 --output artifacts/verification/published-proxy-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_ui_checks.py -- python tools/verify_app_services.py --executable dist-ci/Codexon/Codexon.exe --legacy-collector-exe $published.executable --output artifacts/verification/published-app-services
      - name: Check packaged GUI handoff with multiple custom homes
        if: steps.plan.outputs.package == 'true'
        run: python tools/run_ui_checks.py -- python tools/verify_gui_handoff.py --executable dist-ci/Codexon/Codexon.exe --output artifacts/verification/gui-handoff
      - name: Check proxy replacement with a custom observation filename
        if: steps.plan.outputs.proxy == 'true'
        shell: pwsh
        run: |
          python tools/prepare_legacy_release.py --tag v2026.10.01.1 --output artifacts/legacy-custom-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $published = Get-Content artifacts/legacy-custom-path/result.json -Raw | ConvertFrom-Json
          python tools/verify_proxy_update.py --old-exe $published.executable --new-exe dist-ci/Codexon/Codexon.exe --idle-connections 100 --custom-evidence --output artifacts/verification/custom-observation-update
          exit $LASTEXITCODE
      - name: Check installer payload contents
        if: steps.plan.outputs.package == 'true'
        run: python tools/package_release.py --product dist-ci/Codexon --validate-only
      - name: Seal the fully verified release candidate
        if: needs.resolve.outputs.candidate == 'true'
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler is required on this Windows runner' }
          .\tools\Build-Installer.ps1 -ProductDir dist-ci/Codexon -OutputDir dist-ci/release -Compiler $compiler.FullName
          python tools/release_pipeline.py seal --folder dist-ci/release --product dist-ci/Codexon
          exit $LASTEXITCODE
      - name: Retain the verified installer for later publication
        if: needs.resolve.outputs.candidate == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-${{ github.sha }}
          path: dist-ci/release/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
      - name: Upload redacted synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-verification
          path: |
            artifacts/verification/
            !artifacts/verification/**/*.sqlite*
            !artifacts/verification/**/*.lock
          if-no-files-found: ignore
  publish:
    needs: [resolve, verify]
    if: always() && inputs.publish && needs.resolve.result == 'success' && needs.resolve.outputs.published != 'true' && (needs.verify.result == 'success' || needs.resolve.outputs.reuse_run != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
      - name: Publish the existing verified installer
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ needs.resolve.outputs.reuse_run || github.run_id }}
        run: python tools/release_pipeline.py publish --verified-run "$VERIFIED_RUN"
