name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified main commit as a release
        type: boolean
        default: false
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: requirements-release.lock
      - name: Select release from the checked out commit
        if: inputs.publish
        id: release
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Publish releases from main.' }
          $version = python -c 'from cachemonitor.version import VERSION; print(VERSION)'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the release version.' }
          $tag = "v$version"
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists. Increment VERSION before releasing." }
          if ($LASTEXITCODE -ne 1) { throw 'Cannot check the release tag.' }
          "tag=$tag" | Add-Content $env:GITHUB_OUTPUT
          exit 0
      - name: Install locked dependencies
        run: python -m pip install -r requirements-release.lock
      - name: Plan checks against the actual change base
        id: plan
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          $base = if ($env:EVENT_NAME -eq 'pull_request') { $env:PR_BASE } else { $env:PUSH_BASE }
          $all = $env:EVENT_NAME -eq 'workflow_dispatch' -or -not $base -or $base -match '^0+$'
          [string[]]$checkArgs = if ($all) { @('--full') } else { @('--base', $base) }
          $raw = python tools/verify_changes.py --plan @checkArgs
          if ($LASTEXITCODE -ne 0) { throw ($raw -join "`n") }
          $plan = ($raw -join "`n") | ConvertFrom-Json
          New-Item -ItemType Directory -Path artifacts/verification -Force | Out-Null
          $raw | Set-Content -Encoding utf8 artifacts/verification/plan.json
          "VERIFY_BASE=$base" | Add-Content $env:GITHUB_ENV
          "VERIFY_FULL=$all" | Add-Content $env:GITHUB_ENV
          "package=$($all -or $plan.package_impact)".ToLowerInvariant() | Add-Content $env:GITHUB_OUTPUT
          "proxy=$($all -or $plan.proxy_impact)".ToLowerInvariant() | Add-Content $env:GITHUB_OUTPUT
          "dependencies=$($all -or [bool]($plan.changed -match '^requirements'))".ToLowerInvariant() | Add-Content $env:GITHUB_OUTPUT
          $raw
      - name: Check changed dependencies for vulnerabilities
        if: steps.plan.outputs.dependencies == 'true'
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements-release.lock
      - name: Run selected source checks
        timeout-minutes: 15
        shell: pwsh
        run: |
          [string[]]$checkArgs = if ($env:VERIFY_FULL -eq 'True') { @('--full') } else { @('--base', $env:VERIFY_BASE) }
          python tools/run_ui_checks.py -- python tools/verify_changes.py @checkArgs
          exit $LASTEXITCODE
      - name: Build Windows package
        if: steps.plan.outputs.package == 'true'
        shell: pwsh
        run: .\build.ps1 -DistPath dist-ci -WorkPath build-ci -PythonPath ((Get-Command python).Source)
      - name: Check independent offline recovery
        if: steps.plan.outputs.package == 'true'
        run: |
          python tools/run_ui_checks.py -- python tools/verify_recovery.py --executable dist-ci/Codexon/CodexonRecovery.exe --output artifacts/verification/recovery-ko
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_ui_checks.py -- python tools/verify_recovery.py --executable dist-ci/Codexon/CodexonRecovery.exe --output artifacts/verification/recovery-en --language en
      - name: Build isolated installer
        if: steps.plan.outputs.package == 'true'
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler is required on this Windows runner' }
          .\tools\Build-Installer.ps1 -ProductDir dist-ci/Codexon -OutputDir dist-ci/qa-setup -Compiler $compiler.FullName -Isolated
          python tools/prepare_bad_runtime.py --product dist-ci/Codexon --output dist-ci/bad-runtime
          .\tools\Build-Installer.ps1 -ProductDir dist-ci/bad-runtime -OutputDir dist-ci/qa-bad-runtime -Compiler $compiler.FullName -Isolated
      - name: Check installation, update and removal
        if: steps.plan.outputs.package == 'true'
        run: python tools/run_ui_checks.py -- python tools/verify_installation.py --installer dist-ci/qa-setup/Codexon-Setup.exe --broken-installer dist-ci/qa-bad-runtime/Codexon-Setup.exe --output artifacts/verification/installation
      - name: Check frozen runtime and Qt Quick interaction
        if: steps.plan.outputs.package == 'true'
        run: python tools/run_ui_checks.py -- python tools/verify_changes.py --package-only --package-exe dist-ci/Codexon/Codexon.exe
      - name: Build previous release and check both proxy roles with idle connections
        if: steps.plan.outputs.proxy == 'true'
        shell: pwsh
        run: |
          git worktree add --detach ../codexon-previous v2026.09.25.6
          & ../codexon-previous/build.ps1 -DistPath ../codexon-previous-dist -WorkPath ../codexon-previous-build -PythonPath ((Get-Command python).Source)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_proxy_update.py --old-exe ../codexon-previous-dist/Codexon/Codexon.exe --new-exe dist-ci/Codexon/Codexon.exe --idle-connections 100 --output artifacts/verification/proxy-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_proxy_update.py --old-exe ../codexon-previous-dist/Codexon/Codexon.exe --new-exe dist-ci/Codexon/Codexon.exe --cache-worker --idle-connections 100 --output artifacts/verification/cache-worker-update
      - name: Check packaged app exit, service resume and collector migration
        if: steps.plan.outputs.proxy == 'true'
        run: python tools/run_ui_checks.py -- python tools/verify_app_services.py --executable dist-ci/Codexon/Codexon.exe --legacy-collector-exe ../codexon-previous-dist/Codexon/Codexon.exe --output artifacts/verification/app-services
      - name: Check migration from the actual published installer
        if: steps.plan.outputs.proxy == 'true'
        shell: pwsh
        run: |
          python tools/prepare_legacy_release.py --tag v2026.09.25.6 --output artifacts/legacy-published
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $published = Get-Content artifacts/legacy-published/result.json -Raw | ConvertFrom-Json
          python tools/verify_proxy_update.py --old-exe $published.executable --new-exe dist-ci/Codexon/Codexon.exe --idle-connections 100 --output artifacts/verification/published-proxy-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_proxy_update.py --old-exe $published.executable --new-exe dist-ci/Codexon/Codexon.exe --cache-worker --idle-connections 100 --output artifacts/verification/published-cache-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_ui_checks.py -- python tools/verify_app_services.py --executable dist-ci/Codexon/Codexon.exe --legacy-collector-exe $published.executable --output artifacts/verification/published-app-services
      - name: Check packaged GUI handoff with multiple custom homes
        if: steps.plan.outputs.package == 'true'
        run: python tools/run_ui_checks.py -- python tools/verify_gui_handoff.py --executable dist-ci/Codexon/Codexon.exe --output artifacts/verification/gui-handoff
      - name: Check installer payload contents
        if: steps.plan.outputs.package == 'true'
        run: python tools/package_release.py --product dist-ci/Codexon --validate-only
      - name: Prepare release assets from the verified package
        if: inputs.publish
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $manifest = Get-Content dist-ci/Codexon/build-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.commit -ne $env:GITHUB_SHA -or "v$($manifest.version)" -ne $env:RELEASE_TAG) {
            throw 'The verified package does not match the release commit and version.'
          }
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler is required on this Windows runner' }
          .\tools\Build-Installer.ps1 -ProductDir dist-ci/Codexon -OutputDir dist-ci/release -Compiler $compiler.FullName
          python tools/prepare_sources.py --output dist-ci/release
          if ($LASTEXITCODE -ne 0) { throw 'Third-party source preparation failed.' }
          Copy-Item dist-ci/Codexon/build-manifest.json dist-ci/release/build-manifest.json
      - name: Upload verified release assets
        if: inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist-ci/release/
          if-no-files-found: error
          compression-level: 0
      - name: Upload redacted synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-verification
          path: artifacts/verification/
          if-no-files-found: ignore
  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release
      - name: Publish the verified assets
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          sha256sum --check *.sha256
          test "$(jq -r .commit build-manifest.json)" = "$GITHUB_SHA"
          test "v$(jq -r .version build-manifest.json)" = "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" Codexon-Setup.exe Codexon-Setup.exe.sha256 \
            Codexon-third-party-source-*.zip Codexon-third-party-source-*.zip.sha256 \
            --target "$GITHUB_SHA" --title "Codexon ${RELEASE_TAG#v}" --draft \
            --notes "Source: $GITHUB_SHA. Full verification: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh release edit "$RELEASE_TAG" --draft=false --latest
